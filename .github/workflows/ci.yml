name: CI Pipeline

on:
  push:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run Bandit SAST scan
        run: bandit app.py

      - name: Run dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Build Docker image
        run: docker build -t secure-cicd-app:ci .


      - name: Run Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'secure-cicd-app:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for GHCR
        run: docker tag secure-cicd-app:ci ghcr.io/${{ github.repository_owner }}/secure-cicd-app:${{ github.sha }}

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/secure-cicd-app:${{ github.sha }}



  deploy:
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Pull Docker image from GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/secure-cicd-app:${{ github.sha }}

      - name: Start candidate container
        run: |
          docker rm -f secure-cicd-web-candidate 2>/dev/null || true
          docker run -d \
            --name secure-cicd-web-candidate \
            -p 127.0.0.1:5001:5000 \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-app:${{ github.sha }}

      - name: Smoke test candidate container
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:5001

      - name: Deploy candidate to production
        run: |
          docker rm -f secure-cicd-web 2>/dev/null || true
          docker run -d \
            --name secure-cicd-web \
            -p 127.0.0.1:5000:5000 \
            ghcr.io/${{ github.repository_owner }}/secure-cicd-app:${{ github.sha }}

      - name: Smoke test production container
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:5000

      - name: Clean up candidate container
        run: docker rm -f secure-cicd-web-candidate
